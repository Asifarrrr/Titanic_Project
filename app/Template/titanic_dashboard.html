<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titanic Survival Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0a1625;--panel:#112238;--panel2:#16304d;--line:#27425e;--text:#e8eef5;--mute:#8fa6bd;--brass:#d9a441;--brass2:#f0c56a;--live:#4fd1b5;--lost:#ef6f5e}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font:15px/1.5 "DM Sans",system-ui,sans-serif;background:
 radial-gradient(900px 500px at 85% -10%,#1d4a6e55,transparent 60%),
 radial-gradient(700px 500px at 0% 100%,#d9a44118,transparent 60%),var(--bg);background-attachment:fixed}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:#0d1c2fcc;backdrop-filter:blur(14px);border-right:1px solid var(--line);padding:28px 22px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brass),var(--brass2));display:grid;place-items:center;font-size:20px}
aside h3{font-size:19px}
aside p{color:var(--mute);margin:0 0 28px;font-size:13px}
.fgroup{margin-bottom:28px}
.fgroup>label{display:block;font-weight:600;margin-bottom:12px}
.range-vals{display:flex;justify-content:space-between;margin-bottom:6px;font-weight:600;color:var(--brass2)}
.dual{position:relative;height:28px}
.track{position:absolute;top:12px;left:10px;right:10px;height:4px;background:var(--line);border-radius:4px}
.fill{position:absolute;height:100%;background:linear-gradient(90deg,var(--brass),var(--brass2));border-radius:4px}
.dual input{position:absolute;left:0;top:0;width:100%;height:28px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.dual input::-webkit-slider-runnable-track{background:none}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:all;width:20px;height:20px;border-radius:50%;background:var(--brass);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--brass),0 4px 10px #0008;cursor:grab}
.dual input::-moz-range-thumb{pointer-events:all;width:14px;height:14px;border-radius:50%;background:var(--brass);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--brass);cursor:grab}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--mute);padding:7px 15px;border-radius:999px;cursor:pointer;font:inherit;transition:.18s}
.chip:hover{border-color:var(--brass);color:var(--text)}
.chip.on{background:linear-gradient(135deg,var(--brass),var(--brass2));border-color:transparent;color:#1a1405;font-weight:600}
:is(.chip,button,input,select,summary):focus-visible{outline:2px solid var(--live);outline-offset:2px}
main{padding:32px 38px 60px;max-width:1320px;width:100%}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
header h1{font-size:38px;line-height:1.1;letter-spacing:-.01em}
header p{margin:8px 0 0;color:var(--mute)}
.status{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);padding:8px 15px;border-radius:999px;font-size:13px;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--lost)}
.status.ok .dot{background:var(--live);box-shadow:0 0 0 0 #4fd1b5aa;animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px #4fd1b500}100%{box-shadow:0 0 0 0 #4fd1b500}}
.card{background:linear-gradient(180deg,#14283f,var(--panel));border:1px solid var(--line);border-radius:18px;padding:22px;transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:#3b5f85;box-shadow:0 10px 40px #00000040}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.kpi{position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--brass))}
.kpi span{color:var(--mute);font-size:13px}
.kpi b{display:block;font:700 32px Fraunces,Georgia,serif;margin-top:4px}
.row{display:grid;gap:20px;margin-bottom:22px}
.card h2{font-size:21px;margin-bottom:4px}
.sub{color:var(--mute);margin:0 0 18px;font-size:13px}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.field label{display:block;font-size:13px;color:var(--mute);margin-bottom:5px}
.field input,.field select{width:100%;background:#0a1625;border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:10px;font:inherit;transition:border-color .15s}
.field input:hover,.field select:hover{border-color:#3b5f85}
button.primary{margin-top:20px;width:100%;background:linear-gradient(135deg,var(--brass),var(--brass2));color:#1a1405;border:0;border-radius:12px;padding:14px;font:600 15px "DM Sans";cursor:pointer;transition:transform .15s,box-shadow .15s}
button.primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px #d9a44140}
button.primary:disabled{opacity:.6;cursor:wait;transform:none}
.ticket{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-style:dashed;background:radial-gradient(circle at 50% 0%,var(--panel2),var(--panel))}
.ring{position:relative;width:210px;height:210px;margin:6px 0 14px}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:13;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke-dasharray:502;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1),stroke .4s}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font:700 42px Fraunces,Georgia,serif}
.verdict{font:700 24px Fraunces,Georgia,serif}
.verdict.live{color:var(--live)}.verdict.lost{color:var(--lost)}
.hint{color:var(--mute);font-size:13px;max-width:240px;margin:6px 0 0}
.err{color:var(--lost);font-size:14px;margin-top:10px}
.cwrap{position:relative;height:320px}
details.card summary{cursor:pointer;font:600 21px Fraunces,Georgia,serif}
.tbl{overflow:auto;max-height:380px;margin-top:16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;position:sticky;top:0;background:var(--panel)}
tbody tr:hover{background:#ffffff08}
.pill{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.pill.y{background:#4fd1b522;color:var(--live)}.pill.n{background:#ef6f5e22;color:var(--lost)}
.empty{text-align:center;color:var(--mute);padding:40px}
@media(max-width:1000px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.kpis{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr!important}main{padding:24px 18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;
const API = 'http://127.0.0.1:8000';
const TITLES = ['Mr','Mrs','Don','Col','Capt','Dr','Major','Rev','Jonkheer','The Countess'];
const COL = {live:'#4fd1b5', lost:'#ef6f5e', brass:'#d9a441', blue:'#5b8def', mute:'#8fa6bd', line:'#27425e'};
Chart.defaults.color = COL.mute;
Chart.defaults.font.family = '"DM Sans", system-ui, sans-serif';

const getClass = r => r.Pclass_1 ? 1 : r.Pclass_2 ? 2 : 3;
const getPort = r => r.Embarked_C ? 'C' : r.Embarked_Q ? 'Q' : 'S';
const toggle = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];

/* ---------- Small components ---------- */
function Chips({ values, active, onToggle, label }) {
  return (
    <div className="chips">
      {values.map(v => (
        <button key={v} className={'chip' + (active.includes(v) ? ' on' : '')} onClick={() => onToggle(v)}>
          {label(v)}
        </button>
      ))}
    </div>
  );
}

function DualSlider({ lo, hi, value: [a, b], onChange }) {
  const pct = v => hi === lo ? 0 : (v - lo) / (hi - lo) * 100;
  return (
    <div className="dual">
      <div className="track"><div className="fill" style={{ left: pct(a) + '%', width: (pct(b) - pct(a)) + '%' }} /></div>
      <input type="range" min={lo} max={hi} value={a} aria-label="Minimum fare"
        style={{ zIndex: a > hi - (hi - lo) * 0.1 ? 3 : 1 }}
        onChange={e => onChange([Math.min(+e.target.value, b), b])} />
      <input type="range" min={lo} max={hi} value={b} aria-label="Maximum fare"
        style={{ zIndex: 2 }}
        onChange={e => onChange([a, Math.max(+e.target.value, a)])} />
    </div>
  );
}

function useCountUp(target, decimals = 0) {
  const [v, setV] = useState(0);
  const prev = useRef(0);
  useEffect(() => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { setV(target); return; }
    const from = prev.current, t0 = performance.now(), dur = 700;
    let id;
    const tick = now => {
      const p = Math.min((now - t0) / dur, 1), e = 1 - Math.pow(1 - p, 3);
      setV(from + (target - from) * e);
      if (p < 1) id = requestAnimationFrame(tick); else prev.current = target;
    };
    id = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(id);
  }, [target]);
  return v.toFixed(decimals);
}

function Kpi({ label, value, decimals = 0, prefix = '', suffix = '', accent, empty }) {
  const shown = useCountUp(value, decimals);
  return (
    <div className="card kpi" style={{ '--accent': accent }}>
      <span>{label}</span>
      <b>{empty ? '–' : prefix + Number(shown).toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals }) + suffix}</b>
    </div>
  );
}

function ChartBox({ type, data, options, height }) {
  const ref = useRef(), chart = useRef();
  useEffect(() => {
    chart.current = new Chart(ref.current, { type, data, options });
    return () => chart.current.destroy();
  }, []);
  useEffect(() => {
    if (!chart.current) return;
    chart.current.data = data;
    chart.current.update();
  }, [data]);
  return <div className="cwrap" style={height ? { height } : null}><canvas ref={ref} /></div>;
}

/* ---------- Prediction ---------- */
function Predictor() {
  const [f, setF] = useState({ age: 30, fare: 32, sibsp: 0, parch: 0, sex: 'Male', pclass: 3, embarked: 'S', title: 'Mr' });
  const [res, setRes] = useState(null);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');
  const set = k => e => setF({ ...f, [k]: e.target.value });
  const is = (a, b) => a === b ? 1 : 0;

  async function predict() {
    const pc = +f.pclass;
    const payload = {
      Sex: f.sex === 'Male' ? 1 : 0, Age: +f.age, SibSp: +f.sibsp, Parch: +f.parch,
      Embarked_C: is(f.embarked, 'C'), Embarked_Q: is(f.embarked, 'Q'), Embarked_S: is(f.embarked, 'S'),
      Title_Dr: 0,
      Title_Mr: f.sex === 'Female' ? 0 : 1,
      Title_Mrs: f.sex === 'Male' ? 0 : 1,
      Title_Don: is(f.title, 'Don'), Title_Col: is(f.title, 'Col'), Title_Capt: is(f.title, 'Capt'),
      Title_Jonkheer: is(f.title, 'Jonkheer'), Title_the_Countess: is(f.title, 'The Countess'),
      Title_Major: is(f.title, 'Major'), Title_Rev: is(f.title, 'Rev'),
      Fare: +f.fare, Pclass_1: is(pc, 1), Pclass_2: is(pc, 2), Pclass_3: is(pc, 3)
    };
    setLoading(true); setErr('');
    try {
      const r = await fetch(API + '/predict', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      setRes({ ok: j.Prediction === 1, p: j.Probability });
    } catch (e) {
      setErr('Could not get a prediction. Check that the FastAPI server is running on port 8000.');
    }
    setLoading(false);
  }

  const color = res ? (res.ok ? COL.live : COL.lost) : COL.line;
  const pct = res ? Math.round(res.p * 1000) / 10 : null;

  return (
    <div className="row" style={{ gridTemplateColumns: '1.1fr .9fr' }}>
      <div className="card">
        <h2>Passenger details</h2>
        <p className="sub">Fill in the features, then run the prediction.</p>
        <div className="form">
          <div className="field"><label>Age</label><input type="number" min="0" max="80" value={f.age} onChange={set('age')} /></div>
          <div className="field"><label>Fare</label><input type="number" min="0" max="513" value={f.fare} onChange={set('fare')} /></div>
          <div className="field"><label>Siblings / spouses</label><input type="number" min="0" max="8" value={f.sibsp} onChange={set('sibsp')} /></div>
          <div className="field"><label>Parents / children</label><input type="number" min="0" max="6" value={f.parch} onChange={set('parch')} /></div>
          <div className="field"><label>Sex</label><select value={f.sex} onChange={set('sex')}><option>Male</option><option>Female</option></select></div>
          <div className="field"><label>Class</label><select value={f.pclass} onChange={set('pclass')}><option>1</option><option>2</option><option>3</option></select></div>
          <div className="field"><label>Port</label><select value={f.embarked} onChange={set('embarked')}><option value="S">Southampton (S)</option><option value="C">Cherbourg (C)</option><option value="Q">Queenstown (Q)</option></select></div>
          <div className="field"><label>Title</label><select value={f.title} onChange={set('title')}>{TITLES.map(t => <option key={t}>{t}</option>)}</select></div>
        </div>
        <button className="primary" onClick={predict} disabled={loading}>{loading ? 'Predicting…' : 'Predict survival'}</button>
        {err && <div className="err" role="alert">{err}</div>}
      </div>

      <div className="card ticket">
        <div className="ring">
          <svg viewBox="0 0 180 180">
            <circle className="bg" cx="90" cy="90" r="80" />
            <circle className="fg" cx="90" cy="90" r="80" style={{ stroke: color, strokeDashoffset: 502 * (1 - (res ? res.p : 0)) }} />
          </svg>
          <div className="pct">{res ? pct + '%' : '–'}</div>
        </div>
        <div className={'verdict ' + (res ? (res.ok ? 'live' : 'lost') : '')}>{res ? (res.ok ? 'Survived' : 'Did not survive') : 'No prediction yet'}</div>
        <p className="hint">{res ? `Probability of survival is ${pct}%.` : 'Fill in the passenger details and press Predict survival.'}</p>
      </div>
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const [rows, setRows] = useState([]);
  const [online, setOnline] = useState(null);
  const [fare, setFare] = useState([0, 0]);
  const [cls, setCls] = useState([1, 2, 3]);
  const [emb, setEmb] = useState(['C', 'Q', 'S']);

  useEffect(() => {
    fetch(API + '/data').then(r => r.json()).then(d => {
      setRows(d); setOnline(true);
      const fares = d.map(r => r.Fare);
      setFare([Math.floor(Math.min(...fares)), Math.ceil(Math.max(...fares))]);
    }).catch(() => setOnline(false));
  }, []);

  const bounds = useMemo(() => {
    if (!rows.length) return [0, 1];
    const f = rows.map(r => r.Fare);
    return [Math.floor(Math.min(...f)), Math.ceil(Math.max(...f))];
  }, [rows]);

  const d = useMemo(() => rows.filter(r =>
    r.Fare >= fare[0] && r.Fare <= fare[1] && cls.includes(getClass(r)) && emb.includes(getPort(r))
  ), [rows, fare, cls, emb]);

  const n = d.length;
  const avg = k => { const v = d.filter(r => r[k] != null); return v.length ? v.reduce((s, r) => s + r[k], 0) / v.length : 0; };
  const survRate = n ? d.filter(r => r.Survived == 1).length / n * 100 : 0;

  const scatterData = useMemo(() => {
    const pt = r => ({ x: r.Age, y: r.Fare, sex: r.Sex == 1 ? 'male' : 'female', sib: r.SibSp, par: r.Parch });
    const ok = d.filter(r => r.Age != null);
    return { datasets: [
      { label: 'Survived', data: ok.filter(r => r.Survived == 1).map(pt), backgroundColor: COL.live + 'cc', pointRadius: 4, pointHoverRadius: 7 },
      { label: 'Did not survive', data: ok.filter(r => r.Survived != 1).map(pt), backgroundColor: COL.lost + 'cc', pointRadius: 4, pointHoverRadius: 7 }
    ]};
  }, [d]);

  const pieData = useMemo(() => ({
    labels: ['Cherbourg', 'Queenstown', 'Southampton'],
    datasets: [{ data: ['C', 'Q', 'S'].map(p => d.filter(r => getPort(r) === p).length), backgroundColor: [COL.brass, COL.blue, COL.live], borderColor: '#112238', borderWidth: 3 }]
  }), [d]);

  const barData = useMemo(() => ({
    labels: ['Class 1', 'Class 2', 'Class 3'],
    datasets: [{ data: [1, 2, 3].map(c => { const g = d.filter(r => getClass(r) === c); return g.length ? g.filter(r => r.Survived == 1).length / g.length * 100 : 0; }),
      backgroundColor: [COL.brass, COL.blue, COL.live], borderRadius: 8, maxBarThickness: 60 }]
  }), [d]);

  const grid = { color: COL.line + '88' };
  const scatterOpts = { maintainAspectRatio: false, animation: { duration: 350 },
    scales: { x: { title: { display: true, text: 'Age' }, grid }, y: { title: { display: true, text: 'Fare' }, grid } },
    plugins: { legend: { position: 'bottom', labels: { usePointStyle: true } },
      tooltip: { callbacks: { label: c => `Age ${c.raw.x}, fare ${c.raw.y} · ${c.raw.sex} · ${c.raw.sib} sib/sp · ${c.raw.par} par/ch` } } } };
  const pieOpts = { maintainAspectRatio: false, cutout: '64%', plugins: { legend: { position: 'bottom', labels: { usePointStyle: true } } } };
  const barOpts = { maintainAspectRatio: false, indexAxis: 'y',
    scales: { x: { min: 0, max: 100, ticks: { callback: v => v + '%' }, grid }, y: { grid: { display: false } } },
    plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.raw.toFixed(1) + '% survived' } } } };

  return (
    <div className="app">
      <aside>
        <div className="brand"><div className="logo">⚓</div><h3>Filters</h3></div>
        <p>Narrow the passengers shown in the charts.</p>
        <div className="fgroup">
          <label>Fare</label>
          <div className="range-vals"><span>${fare[0]}</span><span>${fare[1]}</span></div>
          <DualSlider lo={bounds[0]} hi={bounds[1]} value={fare} onChange={setFare} />
        </div>
        <div className="fgroup"><label>Class</label><Chips values={[1, 2, 3]} active={cls} onToggle={v => setCls(toggle(cls, v))} label={v => 'Class ' + v} /></div>
        <div className="fgroup"><label>Port of embarkation</label><Chips values={['C', 'Q', 'S']} active={emb} onToggle={v => setEmb(toggle(emb, v))} label={v => v} /></div>
      </aside>

      <main>
        <header>
          <div>
            <h1>Titanic Survival Prediction</h1>
            <p>A logistic regression model that estimates a passenger's chance of survival.</p>
          </div>
          <div className={'status' + (online ? ' ok' : '')}>
            <span className="dot" />
            {online === null ? 'Connecting to API…' : online ? 'API connected' : 'API offline. Start FastAPI on port 8000'}
          </div>
        </header>

        <section className="kpis">
          <Kpi label="Passengers shown" value={n} empty={!rows.length} accent={COL.blue} />
          <Kpi label="Survival rate" value={survRate} decimals={1} suffix="%" empty={!n} accent={COL.live} />
          <Kpi label="Average age" value={avg('Age')} decimals={1} empty={!n} accent={COL.brass} />
          <Kpi label="Average fare" value={avg('Fare')} decimals={2} prefix="$" empty={!n} accent={COL.lost} />
        </section>

        <Predictor />

        {rows.length > 0 && n === 0 && <div className="card empty row">No passengers match these filters. Widen the fare range or select more classes and ports.</div>}

        {rows.length > 0 && <>
          <section className="row" style={{ gridTemplateColumns: '1.3fr .7fr' }}>
            <div className="card"><h2>Age vs fare</h2><p className="sub">Each dot is a passenger, colored by survival.</p><ChartBox type="scatter" data={scatterData} options={scatterOpts} /></div>
            <div className="card"><h2>Passengers by port</h2><p className="sub">Share of filtered passengers per port.</p><ChartBox type="doughnut" data={pieData} options={pieOpts} /></div>
          </section>
          <section className="card row">
            <div><h2>Survival rate by class</h2><p className="sub">Percent of filtered passengers who survived.</p><ChartBox type="bar" data={barData} options={barOpts} height={230} /></div>
          </section>
          <details className="card">
            <summary>First 100 rows</summary>
            <div className="tbl"><table>
              <thead><tr>{['Survived', 'Sex', 'Age', 'Fare', 'SibSp', 'Parch', 'Class', 'Port'].map(c => <th key={c}>{c}</th>)}</tr></thead>
              <tbody>{rows.slice(0, 100).map((r, i) => (
                <tr key={i}>
                  <td><span className={'pill ' + (r.Survived == 1 ? 'y' : 'n')}>{r.Survived == 1 ? 'Yes' : 'No'}</span></td>
                  <td>{r.Sex == 1 ? 'Male' : 'Female'}</td><td>{r.Age ?? '–'}</td><td>{r.Fare}</td>
                  <td>{r.SibSp}</td><td>{r.Parch}</td><td>{getClass(r)}</td><td>{getPort(r)}</td>
                </tr>))}
              </tbody>
            </table></div>
          </details>
        </>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
